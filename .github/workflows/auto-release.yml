name: Auto-Release

on:
  push:
    branches:
      - main

concurrency:
  group: auto-release
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    uses: owenvoke/semantic-release-config/.github/workflows/release.yml@9d518a80070bf3bc82f997e219a11d6604e1ca43 # v1.4.0
